---
# copyright Utrecht University

volumes:
  # Docroot content lives in a volume, not baked into the image.
  # For the first up, an index.html is seeded from the image.
  paleo_static_html:

services:

  static:
    container_name: paleo-static
    # MVP shortcut, pin the tag in production
    image: paleo-static:latest
    build:
      context: ./images/static
      dockerfile: Dockerfile
    restart: always
    expose:
      - "80"
    volumes:
      - paleo_static_html:/var/www/html:Z
    networks:
      - paleo_net

networks:
  # Shared across all site stacks.
  paleo_net:
    external: true
