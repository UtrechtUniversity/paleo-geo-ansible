# Port 80: always redirect plain HTTP to HTTPS, for every hostname.
server {
    listen 80 default_server;
    listen [::]:80 default_server;

    location / {
        return 301 https://$host$request_uri;
    }
}

# Port 443: reject any hostname we do not serve. 
server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;

    ssl_reject_handshake on;
}
