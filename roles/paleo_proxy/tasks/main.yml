---
# copyright Utrecht University

# paleo_proxy role — deploys the nginx reverse proxy.

- name: Ensure paleo group exists
  ansible.builtin.group:
    name: "{{ paleo_user }}"

- name: Ensure paleo user exists and is in the docker group
  ansible.builtin.user:
    name: "{{ paleo_user }}"
    group: "{{ paleo_user }}"
    groups: docker
    create_home: true

- name: Ensure paleo-ansible/docker/proxy directory exists on the target
  ansible.builtin.file:
    path: "/home/{{ paleo_user }}/paleo-ansible/docker/proxy"
    state: directory
    owner: "{{ paleo_user }}"
    group: "{{ paleo_user }}"
    mode: '0755'

# MVP: copy the docker/proxy/ tree from the Ansible controller.
- name: Copy docker/proxy assets to the target
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/docker/proxy/"
    dest: "/home/{{ paleo_user }}/paleo-ansible/docker/proxy/"
    owner: "{{ paleo_user }}"
    group: "{{ paleo_user }}"
    mode: preserve

- name: Template Docker Compose .env for the proxy
  ansible.builtin.template:
    src: env.j2
    dest: "/home/{{ paleo_user }}/paleo-ansible/docker/proxy/.env"
    owner: "{{ paleo_user }}"
    group: "{{ paleo_user }}"
    mode: '0640'

- name: Open firewall ports for HTTP and HTTPS
  ansible.posix.firewalld:
    port: "{{ item }}/tcp"
    permanent: true
    state: enabled
    immediate: true
  loop:
    - "80"
    - "443"

# MVP: VM builds its own image.
- name: Build proxy image on the target
  ansible.builtin.command:
    cmd: docker compose build
    chdir: "/home/{{ paleo_user }}/paleo-ansible/docker/proxy"
  changed_when: true

- name: Install paleo-proxy.service systemd unit
  ansible.builtin.template:
    src: paleo-proxy.service.j2
    dest: /etc/systemd/system/paleo-proxy.service
    owner: root
    group: root
    mode: '0644'

- name: Enable and start paleo-proxy.service
  ansible.builtin.service:
    name: paleo-proxy
    enabled: true
    state: started
    daemon_reload: true
