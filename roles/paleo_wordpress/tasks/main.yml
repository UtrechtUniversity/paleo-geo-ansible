---
# copyright Utrecht University

# paleo_wordpress role — deploys the LAMP/WordPress stack to a single host.

- name: Ensure paleo group exists
  ansible.builtin.group:
    name: "{{ paleo_user }}"

- name: Ensure paleo user exists and is in the docker group
  ansible.builtin.user:
    name: "{{ paleo_user }}"
    group: "{{ paleo_user }}"
    groups: docker
    create_home: true

- name: Ensure paleo-ansible/docker/wordpress directory exists on the target
  ansible.builtin.file:
    path: "/home/{{ paleo_user }}/paleo-ansible/docker/wordpress"
    state: directory
    owner: "{{ paleo_user }}"
    group: "{{ paleo_user }}"
    mode: '0755'

# MVP shortcut: copy the docker/wordpress/ tree from the Ansible controller.
- name: Copy docker/wordpress assets to the target
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/docker/wordpress/"
    dest: "/home/{{ paleo_user }}/paleo-ansible/docker/wordpress/"
    owner: "{{ paleo_user }}"
    group: "{{ paleo_user }}"
    mode: preserve

- name: Template Docker Compose .env for WordPress
  ansible.builtin.template:
    src: env.j2
    dest: "/home/{{ paleo_user }}/paleo-ansible/docker/wordpress/.env"
    owner: "{{ paleo_user }}"
    group: "{{ paleo_user }}"
    mode: '0640'

# MVP shortcut: VM builds its own image. Production should pull a versioned
# image from a registry built by CI.
- name: Build WordPress image on the target
  ansible.builtin.command:
    cmd: docker compose build
    chdir: "/home/{{ paleo_user }}/paleo-ansible/docker/wordpress"
  changed_when: true

- name: Install paleo-wp.service systemd unit
  ansible.builtin.template:
    src: paleo-wp.service.j2
    dest: /etc/systemd/system/paleo-wp.service
    owner: root
    group: root
    mode: '0644'

- name: Enable and start paleo-wp.service
  ansible.builtin.service:
    name: paleo-wp
    enabled: true
    state: started
    daemon_reload: true
