---
# copyright Utrecht University

# paleo_static role — deploys a static-site backend.

- name: Ensure paleo group exists
  ansible.builtin.group:
    name: "{{ paleo_user }}"

- name: Ensure paleo user exists and is in the docker group
  ansible.builtin.user:
    name: "{{ paleo_user }}"
    group: "{{ paleo_user }}"
    groups: docker
    create_home: true

- name: Ensure paleo-ansible/docker/static directory exists on the target
  ansible.builtin.file:
    path: "/home/{{ paleo_user }}/paleo-ansible/docker/static"
    state: directory
    owner: "{{ paleo_user }}"
    group: "{{ paleo_user }}"
    mode: '0755'

- name: Copy docker/static assets to the target
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/docker/static/{{ item }}"
    dest: "/home/{{ paleo_user }}/paleo-ansible/docker/static/"
    owner: "{{ paleo_user }}"
    group: "{{ paleo_user }}"
    mode: preserve
  loop:
    - docker-compose.yml
    - images
    - backup.sh
    - restore.sh

- name: Template Docker Compose .env for the static site
  ansible.builtin.template:
    src: env.j2
    dest: "/home/{{ paleo_user }}/paleo-ansible/docker/static/.env"
    owner: "{{ paleo_user }}"
    group: "{{ paleo_user }}"
    mode: '0640'

- name: Build static image on the target
  ansible.builtin.command:
    cmd: docker compose build
    chdir: "/home/{{ paleo_user }}/paleo-ansible/docker/static"
  changed_when: true

# Register the service with systemd
- name: Install paleo-static.service systemd unit
  ansible.builtin.template:
    src: paleo-static.service.j2
    dest: /etc/systemd/system/paleo-static.service
    owner: root
    group: root
    mode: '0644'

- name: Enable and start paleo-static.service
  ansible.builtin.service:
    name: paleo-static
    enabled: true
    state: started
    daemon_reload: true
